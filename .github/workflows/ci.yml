name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Dependency consistency check
        run: python -m pip check

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run tests
        run: pytest -q

      # Capacidad de cobertura preparada para Stage 3.
      # Hoy no hay módulos .py en src, por lo que --cov=src reportaría
      # "No data was collected" y generaría una métrica vacía/falsa.
      # Por eso este paso solo informa (always run, continue on error implícito
      # al no ser bloqueante) y no falla el pipeline. En Stage 3, cuando exista
      # ft_engineering.py u otro módulo, se volverá bloqueante con fail-under.
      - name: Coverage report (informational, non-blocking)
        if: always()
        continue-on-error: true
        run: pytest -q --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml tests/

      - name: SonarCloud scan
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
        # Versión indicada por el onboarding oficial de SonarQube Cloud.
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
