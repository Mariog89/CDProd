[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data_regression: pruebas de regresión/integración que dependen del contenido concreto de Base_de_datos.csv",
]

[tool.coverage.run]
source = ["mlops_pipeline/src"]
omit = ["tests/*"]
# Sin fail-under todavía: el umbral se definirá cuando Stage 3 lo decida.
# Cobertura actual sobre mlops_pipeline/src con varios módulos productivos
# (Cargar_datos, ft_engineering, hueristic_model, model_training).

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    "*.ipynb",
    "codigoproyecto-venv/",
    ".atl/",
    "__pycache__/",
    ".pytest_cache/",
    ".ruff_cache/",
    ".coverage*",
    "coverage.xml",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
